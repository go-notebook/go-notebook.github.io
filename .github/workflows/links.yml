name: links

# The landing kit's workflows/links.yml. Every link of the BUILT site is
# checked (the layouts hold template expressions, not URLs) by
# `landingkit links`, at the version go.mod pins: Renovate's bump of the
# partials bumps the checker with them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify --destination ./public
      - name: Check
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit links public
