baseURL = 'https://go-notebook.github.io/'
locale  = 'en-us'
title   = 'go-notebook'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, with the shared partials (styles, theme toggle, fork
# ribbon, icons, hero carousel, red button) from the landing kit.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-notebook: Go notebooks with native speed, kept values and a reproducible order. A notebook is a Markdown file whose go blocks (and ruby blocks, on a pure-Go Ruby) are cells; the kernel compiles it, orders the cells by what they use, and runs only what changed."

# The strip under the top bar: the kit's two chips (CGO_ENABLED=0, then the
# licence) and, under them, "Tested on": only the architectures CI RUNS the
# tests on. notebook and playground ci.yml: amd64 (ubuntu, windows), arm64
# (macos, ubuntu-arm) and riscv64, loong64, ppc64le, s390x under qemu. Targets
# that are only cross-compiled (386, arm, mips...) are not listed.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-notebook.github.io/docs/"
  label = "Read the documentation →"
[[params.cta]]
  kind  = "try"
  href  = "/playground/"
  label = "Try it in your browser"

# The hero's carousel (the landing kit's hero-carousel.html). The first card
# is layouts/partials/hero-terminal.html, the second hero-terminal-ruby.html:
# example/waits.md and what running it printed, checked by the ci workflow.
[params.hero]
  label = "go-notebook in examples"
[[params.hero.cards]]
  terminal = true
  title = "A Go notebook"
[[params.hero.cards]]
  terminal = "ruby"
  title = "Go and Ruby cells, and what they printed"
[[params.hero.cards]]
  title = "Try it in your browser"
  text = "The playground runs notebooks, Go, Ruby, R, Fortran and Julia cells, in WebAssembly in the tab: edit a cell, press Ctrl+Enter, see the result."
  href = "/playground/"
  more = "Open the playground"

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "notebook"
  kind  = "kernel · command"
  href  = "https://github.com/go-notebook/notebook"
  blurb = "The kernel, the <code>notebook</code> command (<code>run</code>, <code>html</code>, <code>watch</code>, <code>serve</code>, <code>irb</code>) and the HTML export: <code>format</code> parses the Markdown, <code>analysis</code> builds the dependency graph from the syntax, <code>gen</code> writes the Go program, <code>kernel</code> compiles and drives it through <code>runtime</code> and keeps results and values, <code>export</code> writes the page. <strong>Ruby cells</strong> (<code>```ruby</code>) run on <a href=\"https://github.com/go-embedded-ruby/ruby\">rbgo</a>, a Ruby written in Go, with the <a href=\"https://github.com/go-scikit/ruby\">go-scikit bindings</a> (<code>Stats</code>, <code>Special</code>, <code>Optimize</code>, <code>Integrate</code>, <code>DataFrame</code>, <code>Plot</code>, <code>NDArray</code>), and share their variables with the Go cells. <code>--timeout</code> and <code>--memory</code> stop a runaway cell in either language. <strong><code>notebook irb</code></strong> is the same Ruby as an interactive session, as irb: <code>=&gt; inspect</code> after each input, <code>_</code>, multi-line input decided by rbgo's parser, Tab completion and history in a pure-Go line editor (<a href=\"https://github.com/go-ruby-reline/reline\">go-ruby-reline</a>), each input in a worker that <code>--timeout</code>, <code>--memory</code> or Ctrl-C can stop without losing the prompt, and <code>--save</code> to keep the session as a notebook. <a href=\"/docs/main/irb/\">More →</a> <strong>Julia cells</strong> (<code>```julia</code>) are parsed with <a href=\"https://github.com/go-embedded-julia/julia\">go-embedded-julia</a>'s parser and checked (syntax errors at their line with julia's message, names in the dependency graph under Julia's scope rules), and, since go-notebook v0.18.0, run by its interpreter (v0.25.0, since go-notebook v0.24.0) in one kernel shared by the Julia cells: a global or a function a cell defines is there in the next one, a top-level loop updates a global as in IJulia (55 for a sum of 1 to 10), and a failure, a <code>MethodError</code> included, is julia's own text. The kernel boots from a prebuilt Base image, fetched on the first Julia cell and loaded only if its SHA-256 is the pinned one (cold start about a second). A cell may run 30 s and 50 million statements, within a memory budget of 512 MiB counted as 16 bytes per array element (a floor, not the heap: strings are not counted, and one array may have at most 2^24 elements). Julia variables cross with Go cells in both directions (Int64, Float64, Bool, String, and vectors and matrices of Float64 or Int64; Go <code>int</code> and <code>[]int</code> as Int64): a Julia value of another type stays in Julia and the Go reader is deferred, naming the type, and a Go value Julia cannot take fails the Julia cell. Inputs are measured before any copy (2^24 elements per array, a cell's inputs together within its memory limit, so a cell can hold up to twice its limit). This breaks v0.18.0, where Julia variables were not shared. Since go-notebook v0.21.0, a Float64 <code>A * x</code> runs through go-blas, non-ASCII <code>uppercase</code>, <code>lowercase</code> and <code>normalize</code> work, and an n×0 matrix crosses. Since go-notebook v0.23.0, a matrix product such as <code>A * A</code> and its display run within the default limits: the v0.24.0 image ships the type inference the display needs, which used to cost about 70 million statements on a kernel's first matrix. Since go-notebook v0.24.0, <code>lu</code>, <code>A \\ b</code> on a square matrix, <code>factorize</code> and <code>cholesky</code> work through go-blas's LU and Cholesky, and a singular or non positive definite matrix raises julia's <code>SingularException</code> or <code>PosDefException</code>; <code>inv</code>, <code>qr</code>, <code>eigen</code>, <code>svd</code> and complex matrices are not there yet. The browser playground runs them too (playground v0.24.0, where a 2×2 product and a 2×2 <code>A \\ b</code> run within its 20 million statements), in a third core that the page loads only when a Julia cell is first run (about 28 MB and about 20 s), with Julia variables kept apart from Go's: 512 MiB, 20 million statements and 20 s per cell. A rerun resets the kernel in 25 to 60 ms instead of loading the image again, and stops the tasks and timers the earlier run started. The worker is replaced only when a reset has to reload the image or fails. <a href=\"/docs/main/julia/\">More →</a> <strong>R cells</strong> (<code>```r</code>) are parsed with <a href=\"https://github.com/go-embedded-r/r\">go-embedded-r</a>'s parser, identical to R 4.6.2 on R's own sources, and checked in the same way: syntax errors at their line in R's words, names in the graph, and a cell that cannot be analysed from its text (<code>&lt;&lt;-</code>, <code>eval</code>, <code>library</code>) depending on every cell above it. They run on go-embedded-r's evaluator in one shared environment (v0.10.0), and since v0.12.0 each cell is bounded: 512 MiB of vectors, 50 million steps, 30 s. The browser playground runs them too (playground v0.15.0), in its second core, with R variables kept apart from the other languages: 512 MiB, 20 million steps, 10 s per cell, and a crash restarts the core with a message on the cell. <a href=\"/docs/main/r/\">More →</a> <strong>Fortran cells</strong> (<code>```fortran</code>) are checked and run with <a href=\"https://github.com/go-embedded-fortran/fortran\">go-embedded-fortran</a> (since go-notebook v0.17.0, go-embedded-fortran v0.17.0: its <code>sema</code> session for the names and errors, its <code>eval.Session</code> for the running; free form, implicit typing off) and highlighted with go-rouge's <code>fortran</code> lexer. The Fortran cells share one session: a cell sees the variables (with the values the earlier cells left), procedures, modules and derived types of the Fortran cells before it. Fortran variables stay in Fortran, as R's do: they are not shared with Go, Ruby, Julia, R or C cells in either direction yet. A cell may make at most 2^32 loop iterations and calls and run 30 s, within a counted memory budget of 512 MiB (since go-notebook v0.20.0), and a failure is reported at its line and column. The browser playground runs them too (playground v0.19.0, go-embedded-fortran v0.30.0), in its second core, with Fortran variables kept apart from the other languages: 512 MiB counted before each allocation (arrays, derived types, character data, pointer targets), 200 million steps, 10 s per cell and a nested-call bound weighted by statement nesting, so an endless <code>do</code>, a runaway recursion or a memory bomb ends with the evaluator's message and leaves the page usable. Since playground v0.22.0 (go-embedded-fortran v0.31.0), types with final procedures or generic assignment, operator or I/O bindings, assumed-length <code>character(*)</code> function results and <code>value</code> on non-scalar or derived dummies are refused with a message instead of running with wrong results. <a href=\"/docs/main/fortran/\">More →</a>"
[[params.repos]]
  name  = "playground"
  kind  = "wasm · page"
  href  = "https://github.com/go-notebook/playground"
  blurb = "<strong>A notebook in the browser, with no server.</strong> The page shows the prose as text and each code cell as a syntax-highlighting editor in Go Mono at 13 px, with a minimap on its right (a click moves the caret) and line annotations, a gutter marker and an inline panel on Ctrl+Shift+M, saved in the Markdown as a <code>gonb:notes</code> comment (a plain text box if the editor fails to load); Ctrl+Enter runs the whole notebook again in the tab. A Go interpreter (<a href=\"https://github.com/traefik/yaegi\">yaegi</a>) compiled to WebAssembly runs the cells, while the libraries they import — go-statistics, go-numerics, go-ndarray, go-plot — run <em>compiled</em>: only the notebook's own code is interpreted. Each run posts the whole notebook to a Web Worker and gets every cell's results back, one call in and one string out, so a long run neither freezes the page nor costs a call per widget. <strong>Ruby cells</strong> run there too, in <a href=\"https://github.com/go-embedded-ruby/ruby\">rbgo</a> with the go-scikit bindings: the page fetches the Ruby core only when the notebook has a Ruby cell. <strong>R cells</strong> run there too, on <a href=\"https://github.com/go-embedded-r/r\">go-embedded-r</a>, in the second core (about 4.5 MB larger), bounded to 512 MiB, 20 million steps and 10 s. <strong>Julia cells</strong> run there too, on <a href=\"https://github.com/go-embedded-julia/julia\">go-embedded-julia</a>, in a third core and its Base image that the page fetches only when a Julia cell is run (about 28 MB and about 20 s the first time, shown on the cell), bounded to 512 MiB, 20 million statements and 20 s, with their variables kept apart from Go's. Nothing reaches the network or a file system, and every figure goes through an allowlist SVG sanitizer. Deployed as <code>/playground/</code> <a href=\"/playground/\">here</a>, with notebooks about the notebook itself, and on <a href=\"https://go-statistics.github.io/playground/\">go-statistics</a> and <a href=\"https://go-numerics.github.io/playground/\">go-numerics</a>."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-notebook.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): what a notebook is, the cell rules, the command, how the kernel decides what to run, and why it is built this way. <a href=\"https://github.com/go-notebook/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-notebook/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cell-rule cards (#cells) and their count come from this list. Each
# statement is from go-notebook/notebook's README and docs/design.md.
[[params.rules]]
  name = "Go, with statements at the top level"
  what = "`x := load(path)` or `fmt.Println(x)` at the top level of a cell is most of what a notebook is. Top-level `func`, `type` and `import` are declarations of the notebook; the rest runs in order."
[[params.rules]]
  name = "One definition per name"
  what = "A name defined at the top level (`:=`, `var`, `const`, `func`, `type`) is shared with every cell, and exactly one cell defines it. Go already forbids two package-level declarations of a name."
[[params.rules]]
  name = "No assignment to another cell's variable"
  what = "The dependency graph would not see the change, so it is refused. Mutation through a method or an element cannot be seen statically and is not refused, as in marimo."
[[params.rules]]
  name = "Private names stay in their cell"
  what = "Names starting with `_`, and `err`, which nearly every cell declares and none means to share."
[[params.rules]]
  name = "The final expression is shown"
  what = "A value with a `Display() map[string][]byte` method shows itself as HTML, SVG or PNG; anything else shows its `%v`."
[[params.rules]]
  name = "Ruby cells join the same graph"
  what = "A `ruby` block runs on rbgo with the go-scikit bindings. A Go variable a Ruby cell reads becomes a Ruby local; a Ruby local a Go cell reads becomes a Go variable typed from its value (a Float is a `float64`, an NDArray the same `*ndarray.Array`). Caching and re-runs cross the two languages."
[[params.rules]]
  name = "Errors name the notebook's lines"
  what = "`//line` directives point every generated line back into the `.md`. A panic stops the cells that read the failing one, and they say why."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.48:1, bright on the dark background 10.05:1.
  base = "#047857"
  deep = "#024935"
  bright = "#34d399"
  shadow = "rgba(4,120,87,.7)"
  glow = "rgba(4,120,87,.6)"
  wash = "rgba(4,120,87,.10)"
  washDeep = "rgba(2,73,53,.06)"
  chipBg = "#e7faf3"
  chipBorder = "#c2f2e0"
  chipFg = "#024935"
  chipBgDark = "rgba(52,211,153,.14)"
  chipBorderDark = "rgba(52,211,153,.32)"
  chipFgDark = "#8fe7c7"
