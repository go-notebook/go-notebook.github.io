baseURL = 'https://go-notebook.github.io/'
locale  = 'en-us'
title   = 'go-notebook'
# No theme -- the layout is the go-* family template (go-fileshare.github.io's,
# via logos/landing-kit, as go-fft and go-ndarray use it): one self-contained
# layouts/index.html, partials/styles.html (the shared sheet, byte-identical)
# and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-notebook: Go notebooks with native speed, kept values and a reproducible order. A notebook is a Markdown file whose go blocks are cells; the kernel compiles it, orders the cells by what they use, and runs only what changed."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "notebook"
  kind  = "kernel · command"
  href  = "https://github.com/go-notebook/notebook"
  blurb = "The kernel, the <code>notebook</code> command (<code>run</code>, <code>html</code>, <code>watch</code>, <code>serve</code>) and the HTML export: <code>format</code> parses the Markdown, <code>analysis</code> builds the dependency graph from the syntax, <code>gen</code> writes the Go program, <code>kernel</code> compiles and drives it through <code>runtime</code> and keeps results and values, <code>export</code> writes the page."
[[params.repos]]
  name  = "playground"
  kind  = "wasm · page"
  href  = "https://github.com/go-notebook/playground"
  blurb = "<strong>A notebook in the browser, with no server.</strong> The page shows the prose as text and each cell as an editor; Ctrl+Enter runs the whole notebook again in the tab. A Go interpreter (<a href=\"https://github.com/traefik/yaegi\">yaegi</a>) compiled to WebAssembly runs the cells, while the libraries they import — go-statistics, go-numerics, go-ndarray, go-plot — run <em>compiled</em>: only the notebook's own code is interpreted. Each run posts the whole notebook to a Web Worker and gets every cell's results back, one call in and one string out, so a long run neither freezes the page nor costs a call per widget. Nothing reaches the network or a file system. Deployed as <code>/playground/</code> on <a href=\"https://go-statistics.github.io/playground/\">go-statistics</a> and <a href=\"https://go-numerics.github.io/playground/\">go-numerics</a>."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-notebook.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): what a notebook is, the cell rules, the command, how the kernel decides what to run, and why it is built this way. <a href=\"https://github.com/go-notebook/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-notebook/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cell-rule cards (#cells) and their count come from this list. Each
# statement is from go-notebook/notebook's README and docs/design.md.
[[params.rules]]
  name = "Go, with statements at the top level"
  what = "`x := load(path)` or `fmt.Println(x)` at the top level of a cell is most of what a notebook is. Top-level `func`, `type` and `import` are declarations of the notebook; the rest runs in order."
[[params.rules]]
  name = "One definition per name"
  what = "A name defined at the top level (`:=`, `var`, `const`, `func`, `type`) is shared with every cell, and exactly one cell defines it. Go already forbids two package-level declarations of a name."
[[params.rules]]
  name = "No assignment to another cell's variable"
  what = "The dependency graph would not see the change, so it is refused. Mutation through a method or an element cannot be seen statically and is not refused, as in marimo."
[[params.rules]]
  name = "Private names stay in their cell"
  what = "Names starting with `_`, and `err`, which nearly every cell declares and none means to share."
[[params.rules]]
  name = "The final expression is shown"
  what = "A value with a `Display() map[string][]byte` method shows itself as HTML, SVG or PNG; anything else shows its `%v`."
[[params.rules]]
  name = "Errors name the notebook's lines"
  what = "`//line` directives point every generated line back into the `.md`. A panic stops the cells that read the failing one, and they say why."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.48:1, bright on the dark background 10.05:1.
  base = "#047857"
  deep = "#024935"
  bright = "#34d399"
  shadow = "rgba(4,120,87,.7)"
  glow = "rgba(4,120,87,.6)"
  wash = "rgba(4,120,87,.10)"
  washDeep = "rgba(2,73,53,.06)"
  chipBg = "#e7faf3"
  chipBorder = "#c2f2e0"
  chipFg = "#024935"
  chipBgDark = "rgba(52,211,153,.14)"
  chipBorderDark = "rgba(52,211,153,.32)"
  chipFgDark = "#8fe7c7"
